name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.24'
          enable-cache: true
      - run: uv sync --locked --no-editable
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync ruff format --check src tests scripts
      - run: uv run --no-sync pytest -q
        env:
          PYTHONPATH: src
      - run: uv run --no-sync python scripts/build_installer.py
      - run: git diff --exit-code install.sh install.ps1
      - run: uv run --no-sync python scripts/build_release.py --output release-site
      - run: uv run --no-sync python scripts/check_installation.py --site release-site --output installer-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: installer-evidence-${{ matrix.os }}-${{ matrix.python }}
          path: installer-report.json
