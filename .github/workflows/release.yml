name: Release artifacts
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2022]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.24'
      - run: uv sync --locked --no-editable
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: uv run --no-sync python -c "import os,tomllib; v=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert os.environ['GITHUB_REF_NAME']=='v'+v"
      - run: uv run --no-sync python scripts/build_release.py --output release-site
      - run: uv run --no-sync python scripts/check_installation.py --site release-site --output installer-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.os }}-${{ matrix.python }}
          path: release-site/
  assemble:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: site-*
          path: platform-sites
      - run: python scripts/merge_releases.py platform-sites release-site
      - uses: actions/upload-artifact@v4
        with:
          name: clef-use-release-site
          path: release-site/
      - run: tar -czf clef-use-release-site.tar.gz -C release-site .
      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" clef-use-release-site.tar.gz --verify-tag --generate-notes --draft
    permissions:
      contents: write
  deploy:
    needs: assemble
    if: >-
      github.repository == 'snowman0919/clef-use' &&
      vars.CLEF_DEPLOY_ENABLED == 'true' &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: [self-hosted, Linux, clef-use-deploy]
    timeout-minutes: 15
    concurrency:
      group: clef-use-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: clef-use-release-site
          path: release-site
      - name: Publish verified site on dev
        run: python3 scripts/deploy_release.py release-site
